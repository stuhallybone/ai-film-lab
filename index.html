-mono);white-space:nowrap}.status i{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:8px}.heading{font-family:var(--display);font-size:clamp(38px,5vw,70px);font-weight:500;line-height:1.04;letter-spacing:-3px;margin:0 0 18px}.heading em{font-style:normal;color:var(--green)}.lead{color:#aaaead;font-size:15px;max-width:650px;line-height:1.75;margin:0 0 30px}.flex{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #444a44;background:transparent;color:var(--white);padding:12px 17px;border-radius:6px;font-size:12px;font-weight:700;min-height:41px}.btn:hover{background:#282b28}.btn.primary{background:var(--green);border-color:var(--green);color:#141714}.btn.primary:hover{background:#e7ffab}.btn.danger{border-color:#64413c;color:var(--red)}.btn.small{padding:9px 12px;min-height:33px}.sectionTop{margin:45px 0 17px;display:flex;justify-content:space-between;align-items:end;gap:20px}.sectionTop h2{font-family:var(--display);font-size:20px;font-weight:500;margin:5px 0 0;letter-spacing:-.4px}.sectionTop span{font:11px var(--mono);color:var(--muted)}.grid{display:grid;gap:13px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--panel);border:1px solid #2c2f30;border-radius:10px;padding:23px;min-width:0}.card.click{cursor:pointer;transition:border-color .15s,transform .15s}.card.click:hover{border-color:#7b9663;transform:translateY(-2px)}.metric{font-family:var(--display);font-size:37px;letter-spacing:-1.8px;margin:13px 0 1px}.muted{color:var(--muted)}.mono{font-family:var(--mono);font-size:11px}.tiny{font-size:11px;line-height:1.5}.cardTitle{font-family:var(--display);font-size:18px;font-weight:500;letter-spacing:-.4px;margin:10px 0 8px}.card p{font-size:13px;color:#aeb2ae;line-height:1.7}.feature{position:re -white);background:#101213;border:1px solid #424747;border-radius:5px;padding:12px;outline:none}textarea{resize:vertical;min-height:98px;line-height:1.5}.input::placeholder,textarea::placeholder{color:#68706b}label{display:block;color:#b7bdb8;font-size:11px;margin:0 0 8px}.field{margin-bottom:18px}.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:0 17px}.empty{padding:56px 24px;text-align:center;border:1px dashed #444b45;border-radius:10px;background:#131615}.emptyIcon{font-size:30px;color:var(--green);margin-bottom:13px}.empty h3{font:500 22px var(--display);margin:0 0 12px}.empty p{margin:0 auto 22px;max-width:420px;color:var(--muted);line-height:1.7}.shotThumb{height:145px;background:linear-gradient(135deg,#222c26,#101312);border-radius:6px;margin:-9px -9px 18px;overflow:hidden;display:grid;place-items:center;position:relative;color:#647368;font-size:32px}.shotThumb img,.shotThumb video{height:100%;width:100%;object-fit:cover}.shotThumb .count{position:absolute;bottom:9px;right:10px;background:#0c0e0bd9;padding:5px 7px;color:white;font:10px var(--mono);border-radius:3px}.shotMeta{display:flex;justify-content:space-between;margin-top:18px;font:10px var(--mono);color:#8f9691}.tag{border:1px solid #495047;border-radius:3px;padding:5px 8px;color:#b7c4b1;font:10px var(--mono)}.tabs{display:flex;gap:6px;margin:24px 0 25px;border-bottom:1px solid var(--stroke);overflow-x:auto}.tabs button{border:0;border-bottom:2px solid transparent;background:none;color:#969b97;padding:12px 16px;white-space:nowrap}.tabs button.active{border-color:var(--green);color:var(--green)}.detailHero{display:flex;align-items:start;justify-content:space-between;gap:15px}.detailHero h2{font:500 clamp(27px,4vw,45px) var(--display);letter-spacing:-1.4px;margin:6px 0}.note{padding:20px;border-left:2px solid var(--green);background:#1b211c;color:#c0cac0;line-height:1.7}.take{border:1px solid var(--stroke);border-radius:8px;background:var(--panel);overflow:hidden}.takeMedia{height:230px;background:#0e1110;display:grid;place-items:center;position:relative;overflow:hidden}.takeMedia img,.takeMedia video{width:100%;height:100%;object-fit:contain}.takeBody{padding:18px}.takeBody h3{font:500 17px var(--display);margin:0 0 6px}.takeBody p{font-size:12px;color:#a4aaa5;line-height:1.6}.mediaDrop{padding:24px;border:1px dashed #626f5d;text-align:center;border-radius:7px;color:#bec8b5;background:#1b241c;cursor:pointer}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.compareMedia{height:290px;border:1px solid var(--stroke);background:#111314;display:grid;place-items:center;border-radius:7px;overflow:hidden}.compareMedia img,.compareMedia video{max-width:100%;max-height:100%;object-fit:contain}.modalLayer{position:fixed;inset:0;z-index:100;background:#020302cc;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto}.modal{background:#191c1d;border:1px solid #3c433c;border-radius:11px;width:min(100%,710px);max-height:92vh;overflow:auto;padding:27px}.modalHead{display:flex;justify-content:space-between;align-items:start;margin-bottom:25px}.modalHead h2{font:500 26px var(--display);margin:4px 0;letter-spacing:-.8px}.x{background:transparent;color:#b5bbb7;font-size:22px;border:none;padding:0 5px}.toast{position:fixed;bottom:22px;right:22px;background:#d7fc7a;color:#11150d;border-radius:6px;padding:13px 16px;font-size:12px;font-weight:700;z-index:150;box-shadow:0 9px 22px #0006}.footer{margin-top:65px;border-top:1px solid var(--stroke);padding-top:18px;display:flex;justify-content:space-between;gap:14px;color:#818982;font:10px var(--mono)}.footer button{background:none;border:0;color:#b1b9ac;font:inherit;text-decoration:underline;cursor:pointer}.mobileHead,.mobileNav{display:none}.chip{display:inline-block;border:1px solid #3b443d;background:#222822;padding:6px 9px;border-radius:4px;font:10px var(--mono);color:#c9d7c4;margin-right:5px;margin-bottom:5px}.index{font:11px var(--mono);color:var(--green)}.noteCard{border-top:1px solid var(--stroke);padding:20px 0}.noteCard h3{font:500 20px var(--display);margin:6px 0}.noteCard p{color:#c0c7c1;line-height:1.7;white-space:pre-wrap}.subtleBtn{border:0;background:none;color:#bec6bd;font:11px var(--mono);padding:5px}.subtleBtn:hover{color:var(--green)}
@media(max-width:1100px){.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:35px 35px 80px}}
@media(max-width:760px){.sidebar{display:none}.mobileHead{display:flex;position:sticky;top:0;z-index:30;background:#101214ef;border-bottom:1px solid var(--stroke);height:59px;padding:0 18px;justify-content:space-between;align-items:center}.mobileHead .markIcon{height:26px;width:26px;font-size:16px}.mobileHead .brandMain{font-size:14px}.mobileNav{display:flex;position:fixed;bottom:0;left:0;right:0;height:69px;padding-bottom:env(safe-area-inset-bottom);background:#141718f5;border-top:1px solid #3d413d;z-index:30;align-items:center;justify-content:space-around}.mobileNav button{border:0;background:transparent;color:#99a098;display:flex;flex-direction:column;align-items:center;gap:5px;font:9px var(--mono);min-width:55px}.mobileNav button.active{color:var(--green)}.mobileNav .navIcon{font-size:19px}.main{margin:0;width:100%;padding:24px 20px 115px}.topline{margin-bottom:29px}.status{font-size:9px}.heading{letter-spacing:-1.8px;font-size:42px}.grid.three,.grid.two,.compareGrid,.formGrid{grid-template-columns:1fr}.card{padding:20px}.feature{min-height:300px;padding:25px}.feature h2{font-size:34px}.sectionTop{margin-top:34px}.detailHero{flex-direction:column}.detailHero .flex{align-self:stretch}.compareMedia{height:230px}.footer{flex-direction:column}.modal{padding:21px;max-height:86vh}.modalLayer{align-items:flex-start;padding-top:7vh}.takeMedia{height:195px}}

<body>
<div id="app"></div><div id="modal-root"></div><div id="toast-root"></div>
<script>
'use strict';
const MODULES=[
{title:'The Director’s Toolkit',short:'Models, platforms, workflows and production economics.',lessons:[['Map the filmmaking landscape','How models and platforms fit into a production pipeline.'],['Choose the right tool','Match a filmmaking problem to a technique and platform.'],['Design a controlled test','Plan a repeatable five-second experiment.']]},
{title:'Consistent Worlds',short:'Characters, environments, references, light and continuity.',lessons:[['Character reference bible','Lock a character’s visual identity across shots.'],['Environment continuity','Establish a reliable place and its geography.'],['Lighting and look','Control visual consistency between generations.']]},
{title:'Directing the Camera',short:'Framing, lenses, movement, depth maps and virtual cameras.',lessons:[['Shot grammar for AI','Design intentional framing and composition.'],['Motion without drift','Control a camera move across five seconds.'],['Virtual camera workflows','Explore depth, 3D blocking and camera transfer.']]},
{title:'Action & Performance',short:'Blocking, gestures, timing, expressions and choreography.',lessons:[['Blocking a beat','Direct a simple physical action.'],['Performance and expression','Shape a readable emotional change.'],['Multiple-character action','Maintain spatial and temporal clarity.']]},
{title:'Advanced Production',short:'Video-to-video, motion transfer, compositing and hybrid pipelines.',lessons:[['Performance-driven video','Transfer motion from filmed reference.'],['Hybrid environments','Combine practical plates, 3D and generated footage.'],['Compositing for control','Use layers to correct rather than regenerate.']]},
{title:'Editing & Sound',short:'Continuity, rhythm, dialogue, music and sound design.',lessons:[['Make shots connect','Build an edit with coherent screen direction.'],['Shape rhythm and sound','Use sound to carry story and impact.'],['Finish a 30-second sequence','Deliver a polished cinematic piece.']]},
{title:'Commercial Production',short:'Briefs, budgets, revisions, rights and delivery.',lessons:[['Break down a brief','Plan a producible commercial treatment.'],['Control revisions and costs','Develop a professional iteration pipeline.'],['Deliver for clients','Prepare masters, usage checks and handover.']]},
{title:'The Director’s Project',short:'A complete original short film, from development to final export.',lessons:[['Develop the concept','Shape a producible short film.'],['Build the production','Create shots, assets and an edit plan.'],['Finish and screen','Complete, review and document the film.']]}
];
const KEY='aifl-workbench-v1';
const seed={completed:[],shots:[],notes:[],projects:[],currentModule:0};
let db=load(),page='home',selectedShot=null,selectedModule=null,modal=null,detailTab='takes',compareIds=[null,null];let urls=[];
function load(){try{return {...seed,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return structuredClone(seed)}}
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}
function id(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(t){return String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function date(t){return new Date(t||Date.now()).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
function toast(t){document.getElementById('toast-root').innerHTML='<div class="toast">'+esc(t)+'</div>';setTimeout(()=>document.getElementById('toast-root').innerHTML='',2700)}
function completedCount(){return db.completed.length}const totalLessons=MODULES.reduce((a,m)=>a+m.lessons.length,0);
function moduleCompletion(i){return MODULES[i].lessons.filter((_,j)=>db.completed.includes(i+':'+j)).length}
function navItems(){return [['home','⌂','Overview'],['academy','▤','The Academy'],['shots','◎','Shot Lab'],['screening','▣','Screening Room'],['notes','✎','Field Notes'],['projects','◈','Productions']]}
function navigate(to){page=to;selectedShot=null;selectedModule=null;modal=null;render();window.scrollTo(0,0)}
function shell(){let nav=navItems();return `<div class="app"><aside class="sidebar"><div class="brand"><div class="mark"><div class="markIcon">△</div><div><div class="brandMain">AI FILM LAB</div><div class="brandSub">DIRECTOR'S WORKBENCH</div></div></div></div><div class="navTitle">THE WORKBENCH</div><nav class="nav">${nav.map(([k,ic,n])=>`<button class="${page===k?'active':''}" onclick="navigate('${k}')"><span class="navIcon">${ic}</span>${n}</button>`).join('')}</nav><div class="sideFoot"><span class="eyebrow">YOUR LAB</span><p>Built for the work.<br>Not for the algorithm.</p><b>● LOCAL WORKSPACE</b><p class="tiny">Your notes and files stay in this browser. Export backups regularly.</p></div></aside><div class="mobileHead"><div class="mark"><span class="markIcon">△</span><span class="brandMain">AI FILM LAB</span></div><span class="eyebrow">WORKBENCH / 01</span></div><div class="main"><div class="topline"><span class="eyebrow">FROM IMAGINATION TO EXECUTION</span><span class="status"><i></i> YOUR PRIVATE LAB</span></div><div id="content"></div><div class="footer"><span>AI FILM LAB / VERSION 0.1 &nbsp; · &nbsp; YOUR WORK, YOUR RULES</span><div><button onclick="exportData()">Export backup</button> · <button onclick="openImport()">Import backup</button></div></div></div><div class="mobileNav">${nav.slice(0,5).map(([k,ic,n])=>`<button class="${page===k?'active':''}" onclick="navigate('${k}')"><span class="navIcon">${ic}</span>${n==='The Academy'?'Academy':n==='Screening Room'?'Screening':n==='Field Notes'?'Notes':n}</button>`).join('')}</div></div>`}
function head(title,sub){return `<h1 class="heading">${title}</h1><p class="lead">${sub}</p>`}
function section(label,title,trailing=''){return `<div class="sectionTop"><div><span>${label}</span><h2>${title}</h2></div>${trailing}</div>`}
function home(){let next=MODULES.findIndex((m,i)=>moduleCompletion(i)<m.lessons.length);if(next<0)next=7;return `${head('Make it <em>move.</em>','Your space to learn the craft, direct the shot and document what actually works. No prompt lottery required.')}<section class="feature"><div class="featureInner"><span class="eyebrow" style="color:var(--green)">CURRENT FOCUS / MODULE ${String(next+1).padStart(2,'0')}</span><h2>${esc(MODULES[next].title)}</h2><p>${esc(MODULES[next].short)} Start small, test deliberately, learn from each take.</p><button class="btn primary" onclick="openModule(${next})">Continue learning ↗</button></div></section>${section('AT A GLANCE','Your progress')}<div class="grid three"><div class="card"><span class="eyebrow">LESSONS COMPLETED</span><div class="metric">${completedCount()}<span class="muted" style="font-size:15px"> / ${totalLessons}</span></div><div class="progress" style="margin-top:18px"><div style="width:${completedCount()/totalLessons*100}%"></div></div></div><div class="card"><span class="eyebrow">SHOTS IN THE LAB</span><div class="metric">${db.shots.length}</div><div class="muted tiny">${db.shots.reduce((n,s)=>n+s.takes.length,0)} recorded takes</div></div><div class="card"><span class="eyebrow">FIELD NOTES</span><div class="metric">${db.notes.length}</div><div class="muted tiny">Techniques, experiments and discoveries</div></div></div>${section('GO MAKE SOMETHING','Open workspaces')}<div class="grid three"><div class="card click" onclick="navigate('academy')"><span class="eyebrow">01 / LEARN</span><h3 class="cardTitle">The Academy ↗</h3><p>Eight modules. Twenty-four lessons. Work through the craft at your own pace.</p></div><div class="card click" onclick="navigate('shots')"><span class="eyebrow">02 / MAKE</span><h3 class="cardTitle">Shot Lab ↗</h3><p>Build a shot, log settings, upload takes and see what really happened.</p></div><div class="card click" onclick="navigate('notes')"><span class="eyebrow">03 / DISCOVER</span><h3 class="cardTitle">Field Notes ↗</h3><p>Keep the techniques, discoveries and happy accidents worth revisiting.</p></div></div>`}
function academy(){if(selectedModule!==null)return moduleDetail(selectedModule);return `${head('The <em>Academy.</em>','A progressive filmmaking curriculum, built around technical control. The modules are a map, not a railway timetable.')}${section('YOUR LEARNING PATH','Eight modules',`<span>${completedCount()} / ${totalLessons} lessons completed</span>`)}<div class="grid two">${MODULES.map((m,i)=>`<article class="card click" onclick="openModule(${i})"><div class="module"><div class="moduleNum">${String(i+1).padStart(2,'0')}</div><div class="moduleBody"><h3 class="cardTitle">${esc(m.title)}</h3><p>${esc(m.short)}</p><div class="flex between" style="margin-bottom:12px"><span class="badge ${moduleCompletion(i)===3?'':'gray'}">${moduleCompletion(i)===3?'COMPLETE':moduleCompletion(i)>0?'IN PROGRESS':'READY TO EXPLORE'}</span><span class="mono muted">${moduleCompletion(i)} / ${m.lessons.length}</span></div><div class="progress"><div style="width:${moduleCompletion(i)/m.lessons.length*100}%"></div></div></div></div></article>`).join('')}</div>`}
function openModule(i){page='academy';selectedModule=i;db.currentModule=i;persist();render();window.scrollTo(0,0)}
function moduleDetail(i){let m=MODULES[i];return `<button class="subtleBtn" onclick="selectedModule=null;render()">← ALL MODULES</button><div style="margin-top:30px"><span class="eyebrow">MODULE ${String(i+1).padStart(2,'0')} / 08</span>${head(esc(m.title).replace(/\.$/,''),esc(m.short))}</div><div class="card"><div class="flex between"><span class="eyebrow">LESSON PLAN</span><span class="mono muted">${moduleCompletion(i)} / 3 COMPLETE</span></div><div style="margin-top:18px">${m.lessons.map(([t,d],j)=>{let done=db.completed.includes(i+':'+j);return `<div class="lessonRow"><span class="circle ${done?'done':''}">${done?'✓':j+1}</span><div><h3>${esc(t)}</h3><p>${esc(d)}</p></div><button class="btn small" onclick="lessonModal(${i},${j})">Open ↗</button></div>`}).join('')}</div></div><div class="note" style="margin-top:20px"><strong>Mastery ≠ one lucky generation.</strong> A lesson is complete when you can explain the technique, demonstrate it, diagnose what went wrong and repeat the result.</div>`}
function lessonModal(i,j){let m=MODULES[i],l=m.lessons[j],done=db.completed.includes(i+':'+j);modal=`<div class="modalHead"><div><span class="eyebrow">MODULE ${i+1} / LESSON ${j+1}</span><h2>${esc(l[0])}</h2></div><button class="x" onclick="closeModal()">×</button></div><p style="color:#b9c1b9;line-height:1.8">${esc(l[1])}</p><div class="line"></div><span class="eyebrow">THE LEARNING LOOP</span><div class="grid two" style="margin:15px 0 22px">${[['UNDERSTAND','Define the technique and the control it gives you.'],['WATCH','Study a practical example or a proven breakdown.'],['MAKE','Plan and execute one focused test.'],['CRITIQUE','Log what succeeded, failed and why.'],['MASTER','Repeat it intentionally before marking complete.']].map(([a,b])=>`<div style="background:#222725;padding:15px;border-radius:5px"><span class="index">${a}</span><div class="tiny" style="margin-top:8px;color:#b5bbb4">${b}</div></div>`).join('')}</div><p class="muted tiny">These are course outlines, not pre-written tutorials. Use your ChatGPT AI Film Lab project to develop and critique each lesson in depth, then record your evidence here.</p><div class="flex wrap"><button class="btn primary" onclick="toggleLesson(${i},${j})">${done?'Mark as still practising':'Mark lesson complete ✓'}</button><button class="btn" onclick="closeModal();navigate('shots');showShotForm()">Create a shot test ↗</button></div>`;renderModal()}
function toggleLesson(i,j){let k=i+':'+j;db.completed=db.completed.includes(k)?db.completed.filter(x=>x!==k):[...db.completed,k];persist();closeModal();render();toast('Lesson progress updated')}
function shots(){if(selectedShot)return shotDetail();return `${head('The Shot <em>Lab.</em>','Every great shot begins with a decision. Plan it, generate it, document it, refine it.')}<div class="flex wrap"><button class="btn primary" onclick="showShotForm()">＋ Create a shot</button><button class="btn" onclick="navigate('screening')">Compare takes ↗</button></div>${section('YOUR SHOT LIBRARY','Experiments',`<span>${db.shots.length} shots</span>`)}${db.shots.length?`<div class="grid three">${db.shots.map(s=>`<article class="card click" onclick="openShot('${s.id}')"><div class="shotThumb" data-thumb="${s.id}">◎<span class="count">${s.takes.length} TAKE${s.takes.length!==1?'S':''}</span></div><span class="eyebrow">${esc(s.project||'INDEPENDENT TEST')}</span><h3 class="cardTitle">${esc(s.name)}</h3><p>${esc(s.intention||'No director’s intention recorded yet.').slice(0,140)}</p><div class="shotMeta"><span>${date(s.created)}</span><span>${esc(s.status||'EXPLORING')}</span></div></article>`).join('')}</div>`:`<div class="empty"><div class="emptyIcon">◎</div><h3>Your next shot starts here.</h3><p>Make one five-second test. Give it a purpose, record the process and see whether you can make the result repeatable.</p><button class="btn primary" onclick="showShotForm()">Create your first shot ↗</button></div>`}`}
function showShotForm(editId){let s=db.shots.find(x=>x.id===editId)||{};modal=`<div class="modalHead"><div><span class="eyebrow">DIRECTOR'S WORKSHEET</span><h2>${editId?'Edit shot':'New shot'}</h2></div><button class="x" onclick="closeModal()">×</button></div><form onsubmit="saveShot(event,'${editId||''}')"><div class="field"><label>Shot title *</label><input class="input" name="name" required maxlength="110" placeholder="e.g. The impossible reveal" value="${esc(s.name||'')}"></div><div class="field"><label>Director’s intention: what MUST happen?</label><textarea name="intention" placeholder="The camera moves clockwise while the actor stays still; the reveal occurs in the final second...">${esc(s.intention||'')}</textarea></div><div class="formGrid"><div class="field"><label>Project / world</label><input class="input" name="project" placeholder="Fragments of Worlds" value="${esc(s.project||'')}"></div><div class="field"><label>Shot status</label><select name="status">${['EXPLORING','IN PROGRESS','LOCKED','ARCHIVED'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Camera / lens / movement</label><input class="input" name="camera" placeholder="35mm, slow orbit left" value="${esc(s.camera||'')}"></div><div class="field"><label>Visual world / lighting</label><input class="input" name="look" placeholder="Cold studio, hard sidelight" value="${esc(s.look||'')}"></div></div><div class="field"><label>Blocking / continuity constraints</label><textarea name="constraints" placeholder="Character remains centre frame. Environment must not shift.">${esc(s.constraints||'')}</textarea></div><button class="btn primary" type="submit">${editId?'Save changes':'Create shot'} ↗</button></form>`;renderModal()}
function saveShot(e,editId){e.preventDefault();let f=new FormData(e.target),s=db.shots.find(x=>x.id===editId);let fields={name:f.get('name').trim(),intention:f.get('intention').trim(),project:f.get('project').trim(),status:f.get('status'),camera:f.get('camera').trim(),look:f.get('look').trim(),constraints:f.get('constraints').trim()};if(s)Object.assign(s,fields);else{s={id:id(),created:Date.now(),takes:[],...fields};db.shots.unshift(s)}persist();closeModal();selectedShot=s.id;page='shots';render();toast('Shot saved')}
function openShot(id){selectedShot=id;page='shots';detailTab='takes';render();window.scrollTo(0,0)}
function shotDetail(){let s=db.shots.find(x=>x.id===selectedShot);if(!s){selectedShot=null;return shots()}return `<button class="subtleBtn" onclick="selectedShot=null;render()">← BACK TO SHOT LAB</button><div class="detailHero" style="margin-top:24px"><div><span class="eyebrow">DIRECTOR'S WORKSHEET / ${esc(s.status)}</span><h2>${esc(s.name)}</h2><p class="muted">${esc(s.project||'Independent experiment')} · Created ${date(s.created)}</p></div><div class="flex wrap"><button class="btn" onclick="showShotForm('${s.id}')">Edit brief</button><button class="btn danger" onclick="deleteShot('${s.id}')">Delete</button></div></div><div class="tabs"><button class="${detailTab==='takes'?'active':''}" onclick="detailTab='takes';render()">Takes (${s.takes.length})</button><button class="${detailTab==='brief'?'active':''}" onclick="detailTab='brief';render()">Director's brief</button></div>${detailTab==='brief'?`<div class="grid two"><div class="card"><span class="eyebrow">INTENTION</span><p>${esc(s.intention||'Not set')}</p></div><div class="card"><span class="eyebrow">CAMERA</span><p>${esc(s.camera||'Not set')}</p></div><div class="card"><span class="eyebrow">VISUAL WORLD</span><p>${esc(s.look||'Not set')}</p></div><div class="card"><span class="eyebrow">BLOCKING & CONTINUITY</span><p>${esc(s.constraints||'Not set')}</p></div></div>`:`<div class="flex wrap between" style="margin-bottom:20px"><p class="muted" style="max-width:560px;line-height:1.7">Keep the failures too. They teach you where the model stopped following direction.</p><button class="btn primary" onclick="showTakeForm('${s.id}')">＋ Log a take</button></div>${s.takes.length?`<div class="grid two">${s.takes.map((t,i)=>`<article class="take"><div class="takeMedia" id="media-${t.id}"><span class="muted">${t.asset?'Loading media…':'No media attached'}</span></div><div class="takeBody"><span class="eyebrow">TAKE ${String(i+1).padStart(2,'0')} / ${date(t.created)}</span><h3 style="margin-top:9px">${esc(t.name||'Untitled take')}</h3><div class="flex wrap">${t.model?`<span class="tag">${esc(t.model)}</span>`:''}${t.rating?`<span class="tag">${esc(t.rating)}</span>`:''}${t.cost?`<span class="tag">${esc(t.cost)}</span>`:''}</div><p><strong style="color:#ecefe9">What happened:</strong> ${esc(t.observation||'No observations recorded.')}</p><p><strong style="color:#ecefe9">Next change:</strong> ${esc(t.next||'Not recorded.')}</p><div class="flex wrap"><button class="btn small" onclick="showTakeForm('${s.id}','${t.id}')">Edit take</button><button class="btn small danger" onclick="deleteTake('${s.id}','${t.id}')">Delete</button></div></div></article>`).join('')}</div>`:`<div class="empty"><div class="emptyIcon">◉</div><h3>No takes yet.</h3><p>Record a generation, attach the result and document what the camera, world and performance actually did.</p><button class="btn primary" onclick="showTakeForm('${s.id}')">Log your first take</button></div>`}`}`}
function showTakeForm(shotId,takeId){let s=db.shots.find(x=>x.id===shotId),t=s.takes.find(x=>x.id===takeId)||{};modal=`<div class="modalHead"><div><span class="eyebrow">${esc(s.name)}</span><h2>${takeId?'Edit take':'Log a take'}</h2></div><button class="x" onclick="closeModal()">×</button></div><form onsubmit="saveTake(event,'${shotId}','${takeId||''}')"><div class="field"><label>Take label</label><input class="input" name="name" value="${esc(t.name||'')}" placeholder="First orbit test"></div><div class="formGrid"><div class="field"><label>Model / platform</label><input class="input" name="model" value="${esc(t.model||'')}" placeholder="e.g. Luma, Runway"></div><div class="field"><label>Generation cost / credits (optional)</label><input class="input" name="cost" value="${esc(t.cost||'')}" placeholder="e.g. 80 credits"></div><div class="field"><label>Result</label><select name="rating">${['UNREVIEWED','WORKED','PARTIAL','FAILED'].map(x=>`<option ${t.rating===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Seed / settings (optional)</label><input class="input" name="settings" value="${esc(t.settings||'')}" placeholder="Duration, aspect ratio, seed"></div></div><div class="field"><label>Prompt / direction used</label><textarea name="prompt" placeholder="Paste the actual prompt or production instructions">${esc(t.prompt||'')}</textarea></div><div class="field"><label>What happened?</label><textarea name="observation" placeholder="The orbit worked, but the face changed at frame 60...">${esc(t.observation||'')}</textarea></div><div class="field"><label>What will you change next?</label><textarea name="next" placeholder="Reduce movement, hold start frame, provide a stronger reference...">${esc(t.next||'')}</textarea></div><div class="field"><label>Attach an image or video${t.asset?' (leave empty to retain current file)':''}</label><input id="takeFile" type="file" accept="image/*,video/*" class="input"><p class="tiny muted">Files are stored in this browser on this device, not uploaded to a server. Large videos can consume storage.</p></div><button class="btn primary" type="submit">Save take ↗</button></form>`;renderModal()}
let mediaDBPromise;
function mediaDB(){if(!mediaDBPromise)mediaDBPromise=new Promise((resolve,reject)=>{let r=indexedDB.open('ai-film-lab-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('assets');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});return mediaDBPromise}
async function assetPut(key,blob){let d=await mediaDB();return new Promise((res,rej)=>{let tx=d.transaction('assets','readwrite');tx.objectStore('assets').put(blob,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
async function assetGet(key){let d=await mediaDB();return new Promise((res,rej)=>{let r=d.transaction('assets').objectStore('assets').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function assetDelete(key){let d=await mediaDB();return new Promise((res,rej)=>{let tx=d.transaction('assets','readwrite');tx.objectStore('assets').delete(key);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function saveTake(e,shotId,takeId){e.preventDefault();let f=new FormData(e.target),s=db.shots.find(x=>x.id===shotId);let t=s.takes.find(x=>x.id===takeId);let fields={name:f.get('name').trim()||'Untitled take',model:f.get('model').trim(),cost:f.get('cost').trim(),rating:f.get('rating'),settings:f.get('settings').trim(),prompt:f.get('prompt').trim(),observation:f.get('observation').trim(),next:f.get('next').trim()};if(!t){t={id:id(),created:Date.now(),asset:null,...fields};s.takes.push(t)}else Object.assign(t,fields);let file=document.getElementById('takeFile').files[0];if(file){if(!file.type.startsWith('image/')&&!file.type.startsWith('video/')){toast('Please select an image or video');return}let key=t.id;if(file.size>150*1024*1024){toast('File exceeds 150 MB. Try a compressed version.');return}try{await assetPut(key,file);t.asset={key,name:file.name,type:file.type,size:file.size}}catch(err){toast('Could not store media. Check browser storage.');return}}persist();closeModal();render();toast('Take recorded')}
async function renderMedia(){urls.forEach(x=>URL.revokeObjectURL(x));urls=[];for(let s of db.shots){let target=document.querySelector(`[data-thumb="${s.id}"]`);if(target){let t=s.takes.findLast(x=>x.asset);if(t)try{let blob=await assetGet(t.asset.key);if(blob){let u=URL.createObjectURL(blob);urls.push(u);target.insertAdjacentHTML('afterbegin',t.asset.type.startsWith('video/')?`<video src="${u}" muted playsinline preload="metadata"></video>`:`<img src="${u}" alt="${esc(s.name)}">`)}}catch{}}for(let t of s.takes){let el=document.getElementById('media-'+t.id);if(el&&t.asset)try{let blob=await assetGet(t.asset.key);if(blob){let u=URL.createObjectURL(blob);urls.push(u);el.innerHTML=t.asset.type.startsWith('video/')?`<video src="${u}" controls playsinline preload="metadata"></video>`:`<img src="${u}" alt="${esc(t.name)}">`}}catch{el.textContent='Media unavailable'}}}}
async function deleteTake(shotId,takeId){if(!confirm('Delete this take and its attached media?'))return;let s=db.shots.find(x=>x.id===shotId),t=s.takes.find(x=>x.id===takeId);if(t?.asset)await assetDelete(t.asset.key).catch(()=>{});s.takes=s.takes.filter(x=>x.id!==takeId);persist();render();toast('Take deleted')}
async function deleteShot(shotId){if(!confirm('Delete this shot and all its takes?'))return;let s=db.shots.find(x=>x.id===shotId);for(let t of s.takes)if(t.asset)await assetDelete(t.asset.key).catch(()=>{});db.shots=db.shots.filter(x=>x.id!==shotId);selectedShot=null;persist();render();toast('Shot deleted')}
function allTakes(){return db.shots.flatMap(s=>s.takes.map(t=>({...t,shotName:s.name,shotId:s.id})))}
function screening(){let takes=allTakes().filter(t=>t.asset);return `${head('Screening <em>Room.</em>','Put two takes side by side. The point isn’t which one looks prettier. It’s which one obeyed the direction.')}${section('THE COMPARISON BENCH','Compare two recorded takes')} ${takes.length<2?`<div class="empty"><div class="emptyIcon">▣</div><h3>Two takes. One decision.</h3><p>Record at least two takes with attached images or videos. Then come back to compare their camera control, consistency and performance.</p><button class="btn primary" onclick="navigate('shots')">Go to Shot Lab ↗</button></div>`:`<div class="compareGrid"><div class="field"><label>TAKE A</label><select onchange="compareIds[0]=this.value;renderCompare()">${optionTakes(takes,compareIds[0])}</select></div><div class="field"><label>TAKE B</label><select onchange="compareIds[1]=this.value;renderCompare()">${optionTakes(takes,compareIds[1])}</select></div></div><div class="compareGrid"><div id="compare-a" class="compareMedia"><span class="muted">Choose take A</span></div><div id="compare-b" class="compareMedia"><span class="muted">Choose take B</span></div></div><div class="note" style="margin-top:20px">Review each take against the shot brief: framing, camera path, continuity, performance, timing and unwanted changes. Record your conclusions in the Shot Lab or Field Notes.</div>`}`}
function optionTakes(takes,v){return `<option value="">Select a take…</option>`+takes.map(t=>`<option value="${t.id}" ${v===t.id?'selected':''}>${esc(t.shotName)} / ${esc(t.name)}</option>`).join('')}
async function renderCompare(){for(let i=0;i<2;i++){let el=document.getElementById(i?'compare-b':'compare-a');if(!el)continue;let t=allTakes().find(x=>x.id===compareIds[i]);if(!t||!t.asset){el.innerHTML='<span class="muted">Choose a take</span>';continue}let b=await assetGet(t.asset.key);if(!b){el.innerHTML='File missing';continue}let u=URL.createObjectURL(b);urls.push(u);el.innerHTML=t.asset.type.startsWith('video/')?`<video controls playsinline src="${u}"></video>`:`<img src="${u}" alt="${esc(t.name)}">`}}
function notes(){return `${head('Field <em>Notes.</em>','The stuff worth remembering. Proven techniques, baffling failures, promising discoveries and advice from the people doing the work.')}<button class="btn primary" onclick="showNoteForm()">＋ Add a field note</button>${section('YOUR NOTEBOOK','Observations',`<span>${db.notes.length} entries</span>`)}${db.notes.length?`<div class="card">${db.notes.map(n=>`<article class="noteCard"><div class="flex between wrap"><span class="eyebrow">${esc(n.category)} / ${date(n.created)}</span><span class="badge ${n.evidence==='TESTED'?'':'gray'}">${esc(n.evidence)}</span></div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p>${n.source?`<p class="tiny muted">Source: ${esc(n.source)}</p>`:''}<div class="flex"><button class="subtleBtn" onclick="showNoteForm('${n.id}')">Edit</button><button class="subtleBtn" onclick="deleteNote('${n.id}')">Delete</button></div></article>`).join('')}</div>`:`<div class="empty"><div class="emptyIcon">✎</div><h3>Start collecting the useful stuff.</h3><p>Capture a technique from Laura, Casey or Omar, or document a result you discovered yourself. Mark whether you've actually tested it.</p><button class="btn primary" onclick="showNoteForm()">Write a field note ↗</button></div>`}`}
function showNoteForm(noteId){let n=db.notes.find(x=>x.id===noteId)||{};modal=`<div class="modalHead"><div><span class="eyebrow">FILM LAB ARCHIVE</span><h2>${noteId?'Edit field note':'New field note'}</h2></div><button class="x" onclick="closeModal()">×</button></div><form onsubmit="saveNote(event,'${noteId||''}')"><div class="field"><label>Title *</label><input class="input" name="title" required value="${esc(n.title||'')}" placeholder="e.g. A better way to hold camera movement"></div><div class="formGrid"><div class="field"><label>Category</label><select name="category">${['TECHNIQUE','WORKFLOW','DISCOVERY','PROBLEM','RESOURCE','COLLABORATOR INSIGHT'].map(x=>`<option ${n.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Evidence</label><select name="evidence">${['HEARD ABOUT','SEEN DEMONSTRATED','TESTED','REPEATABLE'].map(x=>`<option ${n.evidence===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Observation</label><textarea name="body" required style="min-height:150px" placeholder="What is the technique? How does it work? Where did it fail?">${esc(n.body||'')}</textarea></div><div class="field"><label>Source / person / URL (optional)</label><input class="input" name="source" value="${esc(n.source||'')}" placeholder="Laura, Casey, Omar, tutorial URL..."></div><button class="btn primary" type="submit">Save note ↗</button></form>`;renderModal()}
function saveNote(e,noteId){e.preventDefault();let f=new FormData(e.target),fields={title:f.get('title').trim(),category:f.get('category'),evidence:f.get('evidence'),body:f.get('body').trim(),source:f.get('source').trim()},n=db.notes.find(x=>x.id===noteId);if(n)Object.assign(n,fields);else db.notes.unshift({id:id(),created:Date.now(),...fields});persist();closeModal();render();toast('Note archived')}
function deleteNote(noteId){if(!confirm('Delete this note?'))return;db.notes=db.notes.filter(x=>x.id!==noteId);persist();render();toast('Note deleted')}
function projects(){return `${head('The <em>Productions.</em>','A home for the work that eventually becomes a film. Start with an experiment. Let it grow into something worth screening.')}<button class="btn primary" onclick="showProjectForm()">＋ New production</button>${section('PRODUCTION SLATE','Your worlds',`<span>${db.projects.length} projects</span>`)}${db.projects.length?`<div class="grid two">${db.projects.map(p=>`<article class="card"><span class="eyebrow">${esc(p.type)} / ${esc(p.stage)}</span><h3 class="cardTitle">${esc(p.name)}</h3><p>${esc(p.description||'No synopsis added.')}</p><div class="line"></div><div class="flex between"><span class="mono muted">${db.shots.filter(s=>s.project.toLowerCase()===p.name.toLowerCase()).length} linked shots</span><div><button class="subtleBtn" onclick="showProjectForm('${p.id}')">Edit</button><button class="subtleBtn" onclick="deleteProject('${p.id}')">Delete</button></div></div></article>`).join('')}</div>`:`<div class="empty"><div class="emptyIcon">◈</div><h3>Nothing on the slate. Yet.</h3><p>Create a film or commercial project, then use its exact name in the Shot Lab to group your experiments.</p><button class="btn primary" onclick="showProjectForm()">Start a production ↗</button></div>`}`}
function showProjectForm(projectId){let p=db.projects.find(x=>x.id===projectId)||{};modal=`<div class="modalHead"><div><span class="eyebrow">PRODUCTION SLATE</span><h2>${projectId?'Edit production':'New production'}</h2></div><button class="x" onclick="closeModal()">×</button></div><form onsubmit="saveProject(event,'${projectId||''}')"><div class="field"><label>Production title *</label><input class="input" required name="name" value="${esc(p.name||'')}" placeholder="e.g. The Impossible Room"></div><div class="formGrid"><div class="field"><label>Format</label><select name="type">${['SHORT FILM','COMMERCIAL','EXPERIMENT','MUSIC VIDEO','OTHER'].map(x=>`<option ${p.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Stage</label><select name="stage">${['DEVELOPMENT','PRE-PRODUCTION','PRODUCTION','POST-PRODUCTION','COMPLETE'].map(x=>`<option ${p.stage===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Concept / synopsis</label><textarea name="description">${esc(p.description||'')}</textarea></div><button class="btn primary" type="submit">Save production ↗</button></form>`;renderModal()}
function saveProject(e,pid){e.preventDefault();let f=new FormData(e.target),fields={name:f.get('name').trim(),type:f.get('type'),stage:f.get('stage'),description:f.get('description').trim()},p=db.projects.find(x=>x.id===pid);if(p)Object.assign(p,fields);else db.projects.unshift({id:id(),created:Date.now(),...fields});persist();closeModal();render();toast('Production saved')}
function deleteProject(pid){if(!confirm('Delete this production? Linked shots will remain.'))return;db.projects=db.projects.filter(x=>x.id!==pid);persist();render()}
function closeModal(){modal=null;document.getElementById('modal-root').innerHTML=''}
function renderModal(){document.getElementById('modal-root').innerHTML=modal?`<div class="modalLayer" onclick="if(event.target===this)closeModal()"><div class="modal">${modal}</div></div>`:''}
function render(){document.getElementById('app').innerHTML=shell();document.getElementById('content').innerHTML=({home,academy,shots,screening,notes,projects}[page]||home)();renderModal();renderMedia();if(page==='screening')renderCompare()}
function dataURL(blob){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
async function exportData(){try{let assets={};for(let s of db.shots)for(let t of s.takes)if(t.asset){let b=await assetGet(t.asset.key);if(b)assets[t.asset.key]=await dataURL(b)}let payload={version:1,exported:new Date().toISOString(),data:db,assets};let blob=new Blob([JSON.stringify(payload)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='ai-film-lab-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Backup exported')}catch(e){toast('Export failed; check your storage')}}
function openImport(){modal=`<div class="modalHead"><div><span class="eyebrow">DATA & BACKUP</span><h2>Restore your lab</h2></div><button class="x" onclick="closeModal()">×</button></div><p class="muted" style="line-height:1.7">Import a previously exported AI Film Lab JSON backup. This replaces the current notebook, lessons, shots and linked media on this device. Export your existing work first if you need to keep it.</p><div class="field"><label>Choose an AI Film Lab backup</label><input class="input" id="restoreFile" type="file" accept=".json,application/json"></div><button class="btn primary" onclick="importData()">Restore backup</button>`;renderModal()}
async function importData(){let f=document.getElementById('restoreFile').files[0];if(!f){toast('Select a backup file');return}try{let v=JSON.parse(await f.text());if(v.version!==1||!v.data||!Array.isArray(v.data.shots)||!Array.isArray(v.data.completed)||!Array.isArray(v.data.notes)||!Array.isArray(v.data.projects))throw Error('Invalid backup');if(!confirm('Replace your current local AI Film Lab data with this backup?'))return;for(let [key,data] of Object.entries(v.assets||{})){if(!/^data:(image|video)\//.test(data))continue;let b=await(await fetch(data)).blob();await assetPut(key,b)}db=v.data;persist();closeModal();navigate('home');toast('Lab restored')}catch(e){toast('Could not restore this backup')}}
render();
</script>
</body>
</html>
